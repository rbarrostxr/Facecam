name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022"
      - name: Compilar
        run: cmake --build build --config Release
      - name: Guardar o plugin
        uses: actions/upload-artifact@v4
        with:
          name: FL-Camera-VST3
          path: build/FLCamera_artefacts/Release/VST3/
